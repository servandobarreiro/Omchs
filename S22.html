<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omchs</title>
<style>
  :root{
    --bg: #100c14;
    --panel-edge: #2c2135;
    --amber: #dfb249;
    --amber-dim: #8c7239;
    --violet: #b98ff2;
    --cyan: #6fd8d0;
    --rose: #e8a8c8;
    --red: #ff5d5d;
    --text: #d9c8e8;
    --text-dim: #7c6f8c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:
      radial-gradient(1200px 700px at 15% -10%, #1c1424 0%, transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, #14202a 0%, transparent 55%),
      var(--bg);
    color:var(--text); font-family: 'Courier New', ui-monospace, monospace;
    padding: 16px 14px 60px; min-height:100vh;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; }

  .transport{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin: 0 0 16px; }
  .btn{
    background:#241a2d; color:var(--amber); border:1px solid var(--amber-dim);
    padding:9px 16px; cursor:pointer; font-family:inherit; font-size:0.78rem; letter-spacing:0.5px;
    border-radius:3px; transition: all .15s;
  }
  .btn:hover{ border-color:var(--amber); }
  .btn.on{ background:var(--amber); color:#1a1420; border-color:var(--amber); }
  .btn.danger.on{ background:var(--red); color:#1a1420; border-color:var(--red); }
  .iconbtn{ display:flex; align-items:center; justify-content:center; width:42px; height:38px; padding:0; color:var(--amber); }
  .iconbtn.on{ background:var(--amber); color:#1a1420; }
  .iconbtn.muted{ color:var(--text-dim); }
  .iconbtn svg{ display:block; }
  .iconbtn.muted .waves{ opacity:0; }
  .iconbtn:not(.muted) .mutedx{ opacity:0; }

  .faceplate{
    position:relative;
    background: linear-gradient(180deg, #1d1624, #170f1d);
    border:1px solid var(--panel-edge); border-radius:6px; padding:26px 20px 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 6px 18px rgba(0,0,0,0.35);
  }
  .faceplate::before, .faceplate::after{
    content:''; position:absolute; width:5px; height:5px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #6a5c78, #241a2e);
    top:8px; box-shadow: 0 0 0 1px #0a0710;
  }
  .faceplate::before{ left:8px; } .faceplate::after{ right:8px; }
  #cableLayer{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  #cableLayer path{ pointer-events:stroke; }

  .items{ position:relative; z-index:2; display:flex; flex-wrap:wrap; align-items:flex-end; gap: 20px 22px; }

  .knob-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; width: 78px; }
  .topjacks{ display:flex; gap:6px; margin-bottom:5px; height:15px; }
  .size-sm .dial{ width:36px; height:36px; }
  .size-md .dial{ width:50px; height:50px; }
  .size-lg .dial{ width:68px; height:68px; }
  .dialbox{ position:relative; }
  .ring{ position:absolute; top:0; left:50%; transform:translateX(-50%); border-radius:50%; pointer-events:none; --pct:0; }
  .size-sm .ring{ width:48px; height:48px; margin-top:-6px; }
  .size-md .ring{ width:62px; height:62px; margin-top:-6px; }
  .size-lg .ring{ width:82px; height:82px; margin-top:-7px; }
  .ring{
    background: conic-gradient(from -135deg, var(--accent, var(--amber)) 0deg, var(--accent, var(--amber)) calc(var(--pct) * 270deg), transparent calc(var(--pct) * 270deg), transparent 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  }
  /* modring: a translucent halo outside the value ring showing the range a
     patched CV could currently swing the parameter across */
  .modring{ position:absolute; top:0; left:50%; transform:translateX(-50%); border-radius:50%; pointer-events:none;
    --modA:0deg; --modB:0deg; transition: opacity .2s; }
  .size-sm .modring{ width:56px; height:56px; margin-top:-10px; }
  .size-md .modring{ width:70px; height:70px; margin-top:-10px; }
  .size-lg .modring{ width:90px; height:90px; margin-top:-11px; }
  .modring{
    background: conic-gradient(from -135deg, transparent 0deg, transparent var(--modA), rgba(255,255,255,0.65) var(--modA), rgba(255,255,255,0.65) var(--modB), transparent var(--modB), transparent 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
  }
  .dial{
    border-radius:50%; border:2px solid var(--accent, var(--amber));
    background: radial-gradient(circle at 33% 30%, #3a2e47, #1c1522 65%);
    cursor: ns-resize; position:relative; touch-action:none;
    box-shadow: inset 0 0 8px rgba(255,255,255,0.08), 0 0 10px rgba(223,178,73,0.15);
    transform: rotate(-135deg);
  }
  .dial::before{
    content:''; position:absolute; left:50%; top:12%; width:3px; height:32%;
    border-radius:2px; background:var(--accent, var(--amber)); transform:translateX(-50%);
    box-shadow:0 0 6px rgba(223,178,73,0.8);
  }
  .bottomjack{ height:15px; margin-top:5px; }
  .klabel{ font-size:0.6rem; color:var(--text-dim); margin-top:6px; text-align:center; line-height:1.25; }
  .klabel span{ color:var(--accent, var(--amber)); display:block; font-size:0.65rem; }

  .plate{
    position:relative; width:58px; height:50px; background:linear-gradient(180deg,#e8c96a,var(--amber));
    cursor:pointer; user-select:none; touch-action:none;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }
  .plate.active{ background:linear-gradient(180deg,#fff,#ffe9a8); filter: drop-shadow(0 0 10px rgba(255,255,255,0.7)); }
  .plate .jack{ position:absolute; bottom:-14px; left:50%; transform:translateX(-50%); }
  .platesrow{ flex-basis:100%; display:flex; justify-content:center; gap:22px; margin-top:28px; padding-top:10px; flex-wrap:wrap; }

  .jackitem{ display:flex; flex-direction:column; align-items:center; width:52px; }
  .jack{
    width:14px; height:14px; border-radius:50%; border:2px solid var(--cyan); background:#0e1a1a;
    cursor:crosshair; flex-shrink:0; touch-action:none; z-index:3;
  }
  .jack.dst{ border-color:var(--violet); background:#180e1f; }
  .jack:hover{ box-shadow:0 0 8px currentColor; }
  .jacklabel{ font-size:0.55rem; color:var(--text-dim); margin-top:5px; text-align:center; line-height:1.2; }

  .groupbreak{ flex-basis:100%; height:22px; }
  .groupbreak:first-child{ height:0; }

  .footrow{ position:relative; z-index:2; margin-top:18px; padding-top:10px; border-top:1px dashed var(--panel-edge);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .patchhint{ font-size:0.58rem; color:var(--text-dim); line-height:1.5; max-width:520px; }

  .scopewrap{ display:flex; gap:14px; align-items:center; margin-top:16px; flex-wrap:wrap; }
  canvas{ background:#150f1a; display:block; border:1px solid var(--panel-edge); border-radius:4px; }
  .vus{ display:flex; gap:5px; align-items:flex-end; height:150px; }
  .vu{ width:10px; height:100%; background:#150f1a; border:1px solid var(--panel-edge); border-radius:2px; position:relative; overflow:hidden; }
  .vu i{ position:absolute; bottom:0; left:0; right:0; background:linear-gradient(0deg, var(--amber), var(--red)); height:0%; }
  .vulabel{ font-size:0.58rem; color:var(--text-dim); text-align:center; margin-top:3px; }
  .legend{ display:flex; gap:14px; font-size:0.6rem; color:var(--text-dim); margin-top:4px; }
  .legend i{ display:inline-block; width:10px; height:2px; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>
<div class="wrap">
  <div class="transport">
    <button class="btn iconbtn" id="powerMute" title="Power on / Mute" aria-label="Power on or mute">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor" stroke="none"/>
        <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></g>
        <g class="mutedx"><path d="M16 9l6 6M22 9l-6 6"/></g>
      </svg>
    </button>
    <button class="btn" id="chaos">CHAOS</button>
    <button class="btn danger" id="rec">REC WAV</button>
  </div>

  <div class="faceplate">
    <svg id="cableLayer"></svg>
    <div class="items" id="items"></div>
    <div class="footrow">
      <div class="patchhint">Cyan jacks are outputs, violet jacks are inputs. Drag between them to patch. Drag the dot on a cable up/down to set its depth &amp; polarity (attenuverter). Click the dot, or the cable itself, to remove it.</div>
      <button class="btn" id="clearpatch" style="font-size:0.6rem;">CLEAR PATCHES</button>
    </div>
  </div>

  <div class="scopewrap">
    <canvas id="scope" width="640" height="150"></canvas>
    <div>
      <div class="vus">
        <div class="vu"><i id="vuL"></i></div>
        <div class="vu"><i id="vuR"></i></div>
      </div>
      <div class="vulabel">L&nbsp;&nbsp;R</div>
    </div>
  </div>
  <div class="legend"><span><i style="background:var(--amber);"></i>Left</span><span><i style="background:var(--cyan);"></i>Right</span></div>
</div>

<script>
(function(){
  const svgNS = 'http://www.w3.org/2000/svg';

  // ---------- Shared state (declared up-front so UI-building code below never
  // touches these while they're still in the temporal dead zone) ----------
  let ctx;
  let oscTri, oscSqr, triGain, sqrGain, oscASum;
  let subTri, subSqr, subTriGain, subSqrGain, subSum, subG, oscMix;
  let foldDrive, foldNode;
  let oscBTri, oscBSqr, oscBTriGain, oscBSqrGain, oscBSum;
  let groupLIn, groupRIn, delayTaps = [], tapSumL, tapSumR, merger, filter, dcBlock;
  let fbCompressor, fbClip, fbSplit, feedGainL, feedGainR, crossGainL, crossGainR;
  let dryGain, wetGain, outPan, driveN, crushN, masterLimiter, mainG;
  let splitAnalyser, analyserL, analyserR;
  let lfoSrc, randSrc, envSrc, envLoopSrc, runglerNode, runglerSilent, plateSrcs = [];
  let recTap, recSilent, recBuffersL = [], recBuffersR = [], isRec = false, isMute = false;
  let envSchedTimer = null;
  let patchCables = [], destDefs = [];
  let audioReady = false;

  const accentBySection = { osc:'var(--violet)', delay:'var(--amber)', mod:'var(--cyan)', fx:'var(--rose)' };

  // ---------- Parameters ----------
  const config = [
    { id:'pitch',         label:'Pitch',        min:30,   max:600,  def:65,   size:'lg', section:'osc' },
    { id:'instability',    label:'Instability', min:0,    max:1,    def:0.1,  size:'sm', section:'osc' },
    { id:'sub',           label:'Sub-Tonic',    min:0,    max:1,    def:0.4,  size:'md', section:'osc' },
    { id:'tones',         label:'Fold',         min:0,    max:1,    def:0.2,  size:'lg', section:'osc' },
    { id:'oscWaveMorph',  label:'Wave Tri\u2194Sqr', min:0, max:1,  def:0.25, size:'md', section:'osc' },
    { id:'pitchB',        label:'Osc B Pitch',  min:5,    max:2000, def:220,  size:'md', section:'osc' },
    { id:'oscBWaveMorph', label:'Osc B Wave Tri\u2194Sqr', min:0, max:1, def:0.15, size:'sm', section:'osc' },

    { id:'mix',           label:'Dry/Wet',      min:0,    max:1,    def:0.85, size:'md', section:'delay' },
    { id:'time',          label:'Delay Time',   min:0.02, max:1.8,  def:0.4,  size:'lg', section:'delay' },
    { id:'spread',        label:'Spread',       min:0,    max:1,    def:0.5,  size:'md', section:'delay' },
    { id:'smear',         label:'Head Smear',   min:0,    max:0.3,  def:0.02, size:'sm', section:'delay' },
    { id:'decay',         label:'Feedback',     min:0,    max:0.99, def:0.6,  size:'lg', section:'delay' },
    { id:'width',         label:'Stereo Width', min:0,    max:1,    def:0.6,  size:'md', section:'delay' },

    { id:'rate',          label:'Agitation Rate', min:0.05, max:25, def:1.5,  size:'md', section:'mod' },
    { id:'woggle',        label:'Woggle Chaos', min:0,    max:1,    def:0.3,  size:'md', section:'mod' },
    { id:'envAttack',     label:'Env Attack',   min:0.01, max:2,    def:0.08, size:'sm', section:'mod' },
    { id:'envDecay',      label:'Env Decay',    min:0.01, max:3,    def:0.35, size:'sm', section:'mod' },
    { id:'envCurve',      label:'Env Curve',    min:-1,   max:1,    def:0,    size:'sm', section:'mod' },
    { id:'runglerRate',   label:'Rungler Rate', min:0.5,  max:40,   def:6,    size:'md', section:'mod' },
    { id:'runglerChaos',  label:'Rungler Chaos',min:0,    max:1,    def:0.4,  size:'sm', section:'mod' },

    { id:'absorb',        label:'Absorb Filter',min:80,   max:8000, def:1200, size:'lg', section:'fx' },
    { id:'activation',    label:'VCA Open',     min:0,    max:1,    def:0.5,  size:'lg', section:'fx' },
    { id:'drive',         label:'Saturator',    min:1,    max:30,   def:2,    size:'md', section:'fx' },
    { id:'bitcrush',      label:'Bitcrush',     min:0,    max:0.95, def:0,    size:'sm', section:'fx' },
    { id:'pan',           label:'Pan',          min:-1,   max:1,    def:0,    size:'sm', section:'fx' },
  ];
  const params = {};
  const configById = {};
  config.forEach(c => { params[c.id] = c.def; configById[c.id] = c; });

  const touchDef = ['Overload', 'Warp Pitch', 'Time Mod', 'Fold Max', 'Bypass Filter', 'Sub Drone'];

  const knobIO = {
    pitch:        { in:['pitch','fm'] },
    tones:        { in:['fold'] },
    absorb:       { in:['absorb'] },
    decay:        { in:['feedback'] },
    time:         { in:['delay'] },
    activation:   { in:['vca'] },
    pan:          { in:['pan'] },
    pitchB:       { in:['fmb'], out:'oscB' },
    rate:         { out:'lfo' },
    woggle:       { out:'random' },
    envDecay:     { out:'loopenv' },
    runglerRate:  { out:'rungler' },
  };
  knobIO.pitch.out = 'oscA';

  const destLabel = { pitch:'Pitch CV', fm:'FM in', fmb:'Osc B FM', fold:'Fold Drive CV', absorb:'Absorb CV',
    feedback:'Feedback CV', delay:'Delay Time CV', vca:'VCA CV', pan:'Pan CV' };
  const srcLabel = { lfo:'LFO out', random:'Random out', follow:'Follow out', loopenv:'LoopEnv out',
    rungler:'Rungler out', oscA:'Osc A out', oscB:'Osc B out' };

  // ---------- Knobs grouped in space and color by function (no visible labels — kept unmarked on purpose) ----------
  const groups = [
    { key:'mod', items:[
      {t:'knob', id:'rate'}, {t:'knob', id:'woggle'}, {t:'knob', id:'envAttack'}, {t:'knob', id:'envDecay'},
      {t:'knob', id:'envCurve'}, {t:'knob', id:'runglerRate'}, {t:'knob', id:'runglerChaos'}, {t:'src', id:'follow'},
    ]},
    { key:'osc', items:[
      {t:'knob', id:'pitch'}, {t:'knob', id:'oscWaveMorph'}, {t:'knob', id:'tones'},
      {t:'knob', id:'sub'}, {t:'knob', id:'pitchB'}, {t:'knob', id:'oscBWaveMorph'},
      {t:'knob', id:'instability'},
    ]},
    { key:'delay', items:[
      {t:'knob', id:'mix'}, {t:'knob', id:'time'}, {t:'knob', id:'spread'},
      {t:'knob', id:'smear'}, {t:'knob', id:'decay'}, {t:'knob', id:'width'},
    ]},
    { key:'fx', items:[
      {t:'knob', id:'absorb'}, {t:'knob', id:'drive'}, {t:'knob', id:'bitcrush'},
      {t:'knob', id:'pan'}, {t:'knob', id:'activation'},
    ]},
  ];
  const plateOrder = [0, 1, 2, 3, 4, 5];

  const itemsHost = document.getElementById('items');

  function pctOf(c, v){ return (v - c.min) / (c.max - c.min); }
  function updateKnobVisual(c){
    const v = params[c.id];
    const pct = pctOf(c, v);
    const dial = document.getElementById('d-'+c.id);
    dial.style.transform = `rotate(${pct*270-135}deg)`;
    document.getElementById('v-'+c.id).innerText = v.toFixed(2);
    dial.closest('.dialbox').querySelector('.ring').style.setProperty('--pct', pct);
    updateModRing(c.id);
  }
  function makeJack(kind, id, label){
    const j = document.createElement('div');
    j.className = 'jack' + (kind==='dst' ? ' dst' : '');
    j.dataset.kind = kind; j.dataset.id = id;
    j.id = `jack-${kind==='dst'?'dst':'src'}-${id}`;
    j.title = label || id;
    return j;
  }
  function buildKnob(c){
    const io = knobIO[c.id] || {};
    const wrap = document.createElement('div');
    wrap.className = `knob-wrap size-${c.size}`;
    wrap.style.setProperty('--accent', accentBySection[c.section]);

    const topOutPos = io.out && io.outPos === 'top';
    if(io.in || topOutPos){
      const row = document.createElement('div'); row.className = 'topjacks';
      if(io.in) io.in.forEach(destId => row.appendChild(makeJack('dst', destId, destLabel[destId])));
      if(topOutPos) row.appendChild(makeJack('src', io.out, srcLabel[io.out]));
      wrap.appendChild(row);
    }

    const dialbox = document.createElement('div'); dialbox.className = 'dialbox';
    const ring = document.createElement('div'); ring.className = 'ring';
    const dial = document.createElement('div'); dial.className = 'dial'; dial.id = 'd-'+c.id;
    dialbox.appendChild(ring); dialbox.appendChild(dial);
    if(io.in){
      const modring = document.createElement('div'); modring.className = 'modring';
      dialbox.appendChild(modring);
    }
    wrap.appendChild(dialbox);

    if(io.out && !topOutPos){
      const bwrap = document.createElement('div'); bwrap.className = 'bottomjack';
      bwrap.appendChild(makeJack('src', io.out, srcLabel[io.out]));
      wrap.appendChild(bwrap);
    }

    const label = document.createElement('div'); label.className = 'klabel';
    label.innerHTML = `${c.label}<span id="v-${c.id}">${params[c.id].toFixed(2)}</span>`;
    wrap.appendChild(label);

    let dragging = false, sy = 0, sv = 0;
    const baseRange = c.size === 'lg' ? 190 : c.size === 'md' ? 150 : 115;
    dial.addEventListener('pointerdown', e => { dial.setPointerCapture(e.pointerId); dragging = true; sy = e.clientY; sv = params[c.id]; });
    dial.addEventListener('pointermove', e => {
      if(!dragging) return;
      const range = c.max - c.min, div = baseRange * (e.shiftKey ? 5 : 1);
      const dy = sy - e.clientY;
      params[c.id] = Math.max(c.min, Math.min(c.max, sv + (dy * (range/div))));
      updateKnobVisual(c); sync();
    });
    dial.addEventListener('pointerup', () => dragging = false);
    dial.addEventListener('dblclick', () => { params[c.id] = c.def; updateKnobVisual(c); sync(); });
    return wrap;
  }
  function buildPlate(idx){
    const outer = document.createElement('div');
    outer.className = 'plate'; outer.id = `plate-${idx}`; outer.title = touchDef[idx];
    const jack = makeJack('src', 'plate'+idx, touchDef[idx] + ' (drag to patch)');
    jack.id = 'jack-src-plate'+idx;
    jack.addEventListener('pointerdown', e => e.stopPropagation());
    outer.appendChild(jack);
    const act = on => {
      if(!ctx) return;
      outer.classList.toggle('active', on);
      plateSrcs[idx].offset.setTargetAtTime(on ? 1 : 0, ctx.currentTime, on ? 0.005 : 0.08);
      const now = ctx.currentTime;
      if(idx===0){ feedGainL.gain.setTargetAtTime(on?1.35:params.decay, now, 0.015); feedGainR.gain.setTargetAtTime(on?1.35:params.decay, now, 0.015); }
      if(idx===1){ oscTri.frequency.setTargetAtTime(on?params.pitch*4:params.pitch, now, 0.04); oscSqr.frequency.setTargetAtTime(on?params.pitch*4:params.pitch, now, 0.04); }
      if(idx===2) delayTaps.forEach(tp => tp.node.delayTime.setTargetAtTime(on?0.008:params.time*tapRatio(tp.idx,params.spread), now, 0.01));
      if(idx===3) foldDrive.gain.setTargetAtTime(on?14:(1+params.tones*11), now, 0.02);
      if(idx===4) filter.frequency.setTargetAtTime(on?16000:params.absorb, now, 0.02);
      if(idx===5){ subTri.frequency.setTargetAtTime(on?14:params.pitch/2, now, 0.04); subSqr.frequency.setTargetAtTime(on?14:params.pitch/2, now, 0.04); }
    };
    outer.addEventListener('pointerdown', e => { outer.setPointerCapture(e.pointerId); act(true); });
    outer.addEventListener('pointerup', () => act(false));
    outer.addEventListener('pointercancel', () => act(false));
    outer.addEventListener('pointerleave', () => act(false));
    return outer;
  }
  function buildJackItem(kind, id, label){
    const wrap = document.createElement('div'); wrap.className = 'jackitem';
    const jack = makeJack(kind, id, label);
    const lab = document.createElement('div'); lab.className = 'jacklabel'; lab.innerText = label;
    wrap.appendChild(jack); wrap.appendChild(lab);
    return wrap;
  }

  groups.forEach(g => {
    const brk = document.createElement('div'); brk.className = 'groupbreak';
    itemsHost.appendChild(brk);
    g.items.forEach(item => {
      if(item.t === 'knob') itemsHost.appendChild(buildKnob(configById[item.id]));
      else if(item.t === 'src') itemsHost.appendChild(buildJackItem('src', item.id, srcLabel[item.id] || item.id));
      else if(item.t === 'dst') itemsHost.appendChild(buildJackItem('dst', item.id, destLabel[item.id] || item.id));
    });
  });
  const platesRow = document.createElement('div'); platesRow.className = 'platesrow';
  plateOrder.forEach(idx => platesRow.appendChild(buildPlate(idx)));
  itemsHost.appendChild(platesRow);
  config.forEach(updateKnobVisual);

  // ---------- Audio graph ----------

  function tapRatio(i, spread){
    const lin = (i+1)/6;
    const clustered = 0.72 + 0.28*lin;
    const wide = Math.pow(lin, 0.35);
    return clustered*(1-spread) + wide*spread;
  }
  // Genuine reflection wavefolder: mirrors the signal back at +-1 instead of
  // clamping, so it keeps folding (never flattens) no matter how hard it's driven.
  function reflectFold(x){
    let guard = 0;
    while((x > 1 || x < -1) && guard < 16){
      if(x > 1) x = 2 - x;
      else if(x < -1) x = -2 - x;
      guard++;
    }
    return x;
  }
  function setFoldNode(){
    let prev = 0;
    foldNode.onaudioprocess = e => {
      const inp = e.inputBuffer.getChannelData(0), out = e.outputBuffer.getChannelData(0);
      for(let i=0;i<inp.length;i++){
        const cur = inp[i];
        const mid = (prev + cur) * 0.5;
        // cheap 2x oversample (midpoint + current, averaged) to soften fold aliasing
        out[i] = (reflectFold(mid) + reflectFold(cur)) * 0.5;
        prev = cur;
      }
    };
  }
  function setDriveCurve(d){
    const n = 2048, c = new Float32Array(n);
    for(let i=0;i<n;i++){ const x = (i*2)/n - 1; c[i] = Math.tanh(x*d); }
    driveN.curve = c;
  }
  function setSoftClip(node, amount){
    const n = 1024, c = new Float32Array(n);
    for(let i=0;i<n;i++){ const x = (i*2)/n - 1; c[i] = Math.tanh(x*amount)/Math.tanh(amount); }
    node.curve = c;
  }
  function setCrusher(){
    let phase=0, holdL=0, holdR=0;
    crushN.onaudioprocess = e => {
      const inL = e.inputBuffer.getChannelData(0), inR = e.inputBuffer.getChannelData(1);
      const outL = e.outputBuffer.getChannelData(0), outR = e.outputBuffer.getChannelData(1);
      const step = Math.pow(0.5, (1-params.bitcrush)*16);
      for(let i=0;i<inL.length;i++){
        if(params.bitcrush > 0){
          phase += params.bitcrush;
          if(phase >= 1){ phase -= 1; holdL = Math.round(inL[i]/step)*step; holdR = Math.round(inR[i]/step)*step; }
          outL[i] = holdL; outR[i] = holdR;
        } else { outL[i] = inL[i]; outR[i] = inR[i]; }
      }
    };
  }
  function setRecTap(){
    recTap.onaudioprocess = e => {
      if(!isRec) return;
      recBuffersL.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      recBuffersR.push(new Float32Array(e.inputBuffer.getChannelData(1)));
    };
  }
  function setRungler(){
    let phaseA = 0, phaseB = 0, shiftReg = 0, held = 0, prevHigh = false;
    const sr = ctx.sampleRate;
    runglerNode.onaudioprocess = e => {
      const out = e.outputBuffer.getChannelData(0);
      for(let i=0;i<out.length;i++){
        const freqA = params.runglerRate;
        const freqB = params.runglerRate * (0.5 + params.runglerChaos*5.5);
        phaseA += freqA/sr; if(phaseA>=1) phaseA -= 1;
        phaseB += freqB/sr; if(phaseB>=1) phaseB -= 1;
        const clockHigh = phaseA < 0.5;
        const bHigh = phaseB < 0.5 ? 1 : 0;
        if(clockHigh && !prevHigh){
          const fbBit = ((shiftReg >> 7) & 1) ^ bHigh;
          shiftReg = ((shiftReg << 1) | fbBit) & 0xFF;
          held = (shiftReg/255)*2 - 1;
        }
        prevHigh = clockHigh;
        out[i] = held;
      }
    };
  }

  function init(){
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtor){ alert('This browser does not support Web Audio.'); return; }
    ctx = new AudioCtor(); ctx.resume().catch(()=>{});

    // --- Osc A: triangle/square morph ---
    oscTri = ctx.createOscillator(); oscTri.type = 'triangle'; oscTri.frequency.value = params.pitch;
    oscSqr = ctx.createOscillator(); oscSqr.type = 'square'; oscSqr.frequency.value = params.pitch;
    triGain = ctx.createGain(); sqrGain = ctx.createGain();
    triGain.gain.value = 1 - params.oscWaveMorph; sqrGain.gain.value = params.oscWaveMorph;
    oscASum = ctx.createGain();
    oscTri.connect(triGain).connect(oscASum);
    oscSqr.connect(sqrGain).connect(oscASum);

    // --- Sub oscillator: also a triangle/square morph (was a fixed square before) ---
    subTri = ctx.createOscillator(); subTri.type = 'triangle'; subTri.frequency.value = params.pitch/2;
    subSqr = ctx.createOscillator(); subSqr.type = 'square'; subSqr.frequency.value = params.pitch/2;
    subTriGain = ctx.createGain(); subSqrGain = ctx.createGain();
    subTriGain.gain.value = 1 - params.oscWaveMorph; subSqrGain.gain.value = params.oscWaveMorph;
    subSum = ctx.createGain();
    subTri.connect(subTriGain).connect(subSum);
    subSqr.connect(subSqrGain).connect(subSum);
    subG = ctx.createGain(); subG.gain.value = params.sub;
    subSum.connect(subG);

    oscMix = ctx.createGain(); oscMix.gain.value = 0.9;
    oscASum.connect(oscMix); subG.connect(oscMix);

    // --- Osc B: also triangle/square morph, not mixed into the main path —
    // it exists purely as a patchable FM / cross-mod source.
    oscBTri = ctx.createOscillator(); oscBTri.type = 'triangle'; oscBTri.frequency.value = params.pitchB;
    oscBSqr = ctx.createOscillator(); oscBSqr.type = 'square'; oscBSqr.frequency.value = params.pitchB;
    oscBTriGain = ctx.createGain(); oscBSqrGain = ctx.createGain();
    oscBTriGain.gain.value = 1 - params.oscBWaveMorph; oscBSqrGain.gain.value = params.oscBWaveMorph;
    oscBSum = ctx.createGain();
    oscBTri.connect(oscBTriGain).connect(oscBSum);
    oscBSqr.connect(oscBSqrGain).connect(oscBSum);
    oscBTri.start(); oscBSqr.start();

    // --- True wavefolder: reflects at the boundary, never clips ---
    foldDrive = ctx.createGain(); foldDrive.gain.value = 1 + params.tones*11;
    foldNode = ctx.createScriptProcessor(1024, 1, 1); setFoldNode();
    oscMix.connect(foldDrive).connect(foldNode);

    const excite = ctx.createGain(); excite.gain.value = 0.55;
    foldNode.connect(excite);

    // Dry tap, pre-delay — lets the Mix knob blend the raw oscillator/fold
    // tone in with the delayed/filtered loop instead of always being 100% wet.
    dryGain = ctx.createGain(); dryGain.gain.value = 1 - params.mix;
    excite.connect(dryGain);

    // --- Stereo feedback loop ---
    groupLIn = ctx.createGain(); groupRIn = ctx.createGain();
    excite.connect(groupLIn); excite.connect(groupRIn);

    tapSumL = ctx.createGain(); tapSumR = ctx.createGain();
    delayTaps = [];
    for(let i=0;i<6;i++){
      const d = ctx.createDelay(5.0);
      const g = ctx.createGain(); g.gain.value = 0.55 / (Math.floor(i/2)+1);
      const isL = i % 2 === 0;
      (isL ? groupLIn : groupRIn).connect(d);
      d.connect(g); g.connect(isL ? tapSumL : tapSumR);
      delayTaps.push({ node:d, gain:g, isL, idx:i });
    }

    merger = ctx.createChannelMerger(2);
    tapSumL.connect(merger, 0, 0); tapSumR.connect(merger, 0, 1);

    filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.Q.value = 1.3;
    filter.frequency.value = params.absorb;
    merger.connect(filter);

    dcBlock = ctx.createBiquadFilter(); dcBlock.type = 'highpass'; dcBlock.frequency.value = 12;
    fbCompressor = ctx.createDynamicsCompressor();
    fbCompressor.threshold.value = -8; fbCompressor.knee.value = 6; fbCompressor.ratio.value = 20;
    fbCompressor.attack.value = 0.002; fbCompressor.release.value = 0.12;
    fbClip = ctx.createWaveShaper(); fbClip.oversample = '2x'; setSoftClip(fbClip, 1.4);
    filter.connect(dcBlock).connect(fbCompressor).connect(fbClip);

    fbSplit = ctx.createChannelSplitter(2);
    fbClip.connect(fbSplit);
    feedGainL = ctx.createGain(); feedGainL.gain.value = params.decay;
    feedGainR = ctx.createGain(); feedGainR.gain.value = params.decay;
    crossGainL = ctx.createGain(); crossGainL.gain.value = (1-params.width)*0.6;
    crossGainR = ctx.createGain(); crossGainR.gain.value = (1-params.width)*0.6;
    fbSplit.connect(feedGainL, 0); fbSplit.connect(crossGainR, 0);
    fbSplit.connect(feedGainR, 1); fbSplit.connect(crossGainL, 1);
    feedGainL.connect(groupLIn); crossGainL.connect(groupLIn);
    feedGainR.connect(groupRIn); crossGainR.connect(groupRIn);

    // --- Output chain ---
    outPan = ctx.createStereoPanner(); outPan.pan.value = params.pan;
    wetGain = ctx.createGain(); wetGain.gain.value = params.mix;
    filter.connect(wetGain);
    wetGain.connect(outPan); dryGain.connect(outPan);
    driveN = ctx.createWaveShaper(); driveN.oversample = '2x'; setDriveCurve(params.drive);
    outPan.connect(driveN);
    crushN = ctx.createScriptProcessor(2048, 2, 2); setCrusher();
    driveN.connect(crushN);
    masterLimiter = ctx.createDynamicsCompressor();
    masterLimiter.threshold.value = -2; masterLimiter.knee.value = 4; masterLimiter.ratio.value = 14;
    masterLimiter.attack.value = 0.002; masterLimiter.release.value = 0.1;
    crushN.connect(masterLimiter);
    mainG = ctx.createGain(); mainG.gain.value = params.activation;
    masterLimiter.connect(mainG);
    mainG.connect(ctx.destination);

    splitAnalyser = ctx.createChannelSplitter(2);
    analyserL = ctx.createAnalyser(); analyserL.fftSize = 1024;
    analyserR = ctx.createAnalyser(); analyserR.fftSize = 1024;
    mainG.connect(splitAnalyser);
    splitAnalyser.connect(analyserL, 0); splitAnalyser.connect(analyserR, 1);

    recTap = ctx.createScriptProcessor(4096, 2, 2); setRecTap();
    recSilent = ctx.createGain(); recSilent.gain.value = 0;
    mainG.connect(recTap); recTap.connect(recSilent); recSilent.connect(ctx.destination);

    lfoSrc = ctx.createOscillator(); lfoSrc.type = 'triangle'; lfoSrc.frequency.value = params.rate; lfoSrc.start();
    randSrc = ctx.createConstantSource(); randSrc.offset.value = 0; randSrc.start();
    envSrc = ctx.createConstantSource(); envSrc.offset.value = 0; envSrc.start();
    envLoopSrc = ctx.createConstantSource(); envLoopSrc.offset.value = 0; envLoopSrc.start();
    runglerNode = ctx.createScriptProcessor(1024, 1, 1); setRungler();
    runglerSilent = ctx.createGain(); runglerSilent.gain.value = 0;
    runglerNode.connect(runglerSilent); runglerSilent.connect(ctx.destination);
    plateSrcs = touchDef.map(() => { const c = ctx.createConstantSource(); c.offset.value = 0; c.start(); return c; });

    oscTri.start(); oscSqr.start(); subTri.start(); subSqr.start();

    setInterval(() => {
      if(!ctx || isMute) return;
      const drift = (Math.random()-0.5) * params.instability * 6;
      oscTri.frequency.setTargetAtTime(params.pitch + drift, ctx.currentTime, 0.03);
      oscSqr.frequency.setTargetAtTime(params.pitch + drift, ctx.currentTime, 0.03);
      subTri.frequency.setTargetAtTime((params.pitch + drift)/2, ctx.currentTime, 0.03);
      subSqr.frequency.setTargetAtTime((params.pitch + drift)/2, ctx.currentTime, 0.03);
      if(params.smear > 0){
        delayTaps.forEach(t => {
          const base = params.time * tapRatio(t.idx, params.spread);
          const wobble = base * (1 + (Math.random()-0.5) * params.smear * 4);
          t.node.delayTime.setTargetAtTime(Math.max(0.001, Math.min(4.9, wobble)), ctx.currentTime, 0.03);
        });
      }
    }, 40);

    setInterval(() => {
      if(!ctx || isMute) return;
      if(Math.random() < 0.15 + params.woggle*0.6){
        randSrc.offset.setTargetAtTime(Math.random()*2-1, ctx.currentTime, 0.04);
      }
      if(params.woggle > 0 && Math.random() < params.woggle){
        filter.frequency.setTargetAtTime(Math.max(50, params.absorb + (Math.random()-0.5)*1400*params.woggle), ctx.currentTime, 0.15);
      }
    }, 220);

    destDefs = [
      { id:'pitch', targets:[{ getParam:()=>oscTri.frequency, sens:250 }, { getParam:()=>oscSqr.frequency, sens:250 }, { getParam:()=>subTri.frequency, sens:125 }, { getParam:()=>subSqr.frequency, sens:125 }] },
      { id:'fm', targets:[{ getParam:()=>oscTri.frequency, sens:700 }, { getParam:()=>oscSqr.frequency, sens:700 }] },
      { id:'fmb', targets:[{ getParam:()=>oscBTri.frequency, sens:500 }, { getParam:()=>oscBSqr.frequency, sens:500 }] },
      { id:'fold', targets:[{ getParam:()=>foldDrive.gain, sens:4 }] },
      { id:'absorb', targets:[{ getParam:()=>filter.frequency, sens:3200 }] },
      { id:'feedback', targets:[{ getParam:()=>feedGainL.gain, sens:0.45 }, { getParam:()=>feedGainR.gain, sens:0.45 }] },
      { id:'delay', targets: delayTaps.map(t => ({ getParam:()=>t.node.delayTime, sens:0.12 })) },
      { id:'vca', targets:[{ getParam:()=>mainG.gain, sens:0.5 }] },
      { id:'pan', targets:[{ getParam:()=>outPan.pan, sens:1 }] },
    ];

    scheduleEnvLoop();
    wireJacks();
    drawScope();
    audioReady = true;
  }

  function sync(){
    if(!ctx) return;
    const now = ctx.currentTime;
    oscTri.frequency.setTargetAtTime(params.pitch, now, 0.01);
    oscSqr.frequency.setTargetAtTime(params.pitch, now, 0.01);
    triGain.gain.setTargetAtTime(1-params.oscWaveMorph, now, 0.02);
    sqrGain.gain.setTargetAtTime(params.oscWaveMorph, now, 0.02);

    subTri.frequency.setTargetAtTime(params.pitch/2, now, 0.01);
    subSqr.frequency.setTargetAtTime(params.pitch/2, now, 0.01);
    subTriGain.gain.setTargetAtTime(1-params.oscWaveMorph, now, 0.02);
    subSqrGain.gain.setTargetAtTime(params.oscWaveMorph, now, 0.02);
    subG.gain.setTargetAtTime(params.sub, now, 0.02);

    oscBTri.frequency.setTargetAtTime(params.pitchB, now, 0.01);
    oscBSqr.frequency.setTargetAtTime(params.pitchB, now, 0.01);
    oscBTriGain.gain.setTargetAtTime(1-params.oscBWaveMorph, now, 0.02);
    oscBSqrGain.gain.setTargetAtTime(params.oscBWaveMorph, now, 0.02);

    foldDrive.gain.setTargetAtTime(1 + params.tones*11, now, 0.02);
    dryGain.gain.setTargetAtTime(1 - params.mix, now, 0.02);
    wetGain.gain.setTargetAtTime(params.mix, now, 0.02);

    delayTaps.forEach(t => {
      const base = params.time * tapRatio(t.idx, params.spread);
      t.node.delayTime.setTargetAtTime(Math.max(0.001, Math.min(4.9, base)), now, 0.03);
    });
    feedGainL.gain.setTargetAtTime(params.decay, now, 0.02);
    feedGainR.gain.setTargetAtTime(params.decay, now, 0.02);
    const cross = (1-params.width)*0.6;
    crossGainL.gain.setTargetAtTime(cross, now, 0.05);
    crossGainR.gain.setTargetAtTime(cross, now, 0.05);
    filter.frequency.setTargetAtTime(params.absorb, now, 0.01);
    lfoSrc.frequency.setTargetAtTime(params.rate, now, 0.02);
    outPan.pan.setTargetAtTime(params.pan, now, 0.02);
    setDriveCurve(params.drive);
    if(!isMute) mainG.gain.setTargetAtTime(params.activation, now, 0.02);
  }

  // ---------- Looping AD envelope ----------
  function envCurveArray(rising){
    const n = 64, arr = new Float32Array(n);
    const p = Math.pow(3, params.envCurve);
    for(let i=0;i<n;i++){
      const t = i/(n-1);
      const v = Math.pow(t, p);
      arr[i] = rising ? v : 1 - v;
    }
    return arr;
  }
  function scheduleEnvLoop(){
    if(!ctx) return;
    const a = Math.max(0.01, params.envAttack), d = Math.max(0.01, params.envDecay);
    const now = ctx.currentTime + 0.02;
    envLoopSrc.offset.cancelScheduledValues(now);
    envLoopSrc.offset.setValueCurveAtTime(envCurveArray(true), now, a);
    envLoopSrc.offset.setValueCurveAtTime(envCurveArray(false), now + a, d);
    clearTimeout(envSchedTimer);
    envSchedTimer = setTimeout(scheduleEnvLoop, Math.max(20, (a+d)*1000 - 15));
  }

  // ---------- Power / Mute ----------
  const powerMuteBtn = document.getElementById('powerMute');
  function updatePowerIcon(){
    const on = !!ctx && !isMute;
    powerMuteBtn.classList.toggle('on', on);
    powerMuteBtn.classList.toggle('muted', !on);
  }
  powerMuteBtn.addEventListener('click', () => {
    if(!ctx){ init(); isMute = false; }
    else {
      if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
      isMute = !isMute;
      mainG.gain.setTargetAtTime(isMute?0:params.activation, ctx.currentTime, 0.03);
    }
    updatePowerIcon();
  });
  updatePowerIcon();

  document.getElementById('chaos').addEventListener('click', () => {
    config.forEach(c => { params[c.id] = c.min + Math.random()*(c.max-c.min); updateKnobVisual(c); });
    sync();
    if(ctx && patchCables.length < 5 && Math.random() < 0.4){
      const srcIds = ['lfo','random','follow','loopenv','rungler','oscA','oscB'];
      const dstIds = destDefs.map(d => d.id);
      addPatch(srcIds[Math.floor(Math.random()*srcIds.length)], dstIds[Math.floor(Math.random()*dstIds.length)]);
    }
  });

  // ---------- WAV recorder ----------
  function encodeWav(buffersL, buffersR, sampleRate){
    let total = 0; for(const b of buffersL) total += b.length;
    const interleaved = new Float32Array(total*2);
    let o = 0;
    for(let i=0;i<buffersL.length;i++){
      const L = buffersL[i], R = buffersR[i];
      for(let j=0;j<L.length;j++){ interleaved[o++] = L[j]; interleaved[o++] = R[j]; }
    }
    const buffer = new ArrayBuffer(44 + interleaved.length*2);
    const view = new DataView(buffer);
    const writeStr = (off, s) => { for(let i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); };
    writeStr(0,'RIFF'); view.setUint32(4, 36 + interleaved.length*2, true); writeStr(8,'WAVE');
    writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,2,true);
    view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate*4, true);
    view.setUint16(32,4,true); view.setUint16(34,16,true);
    writeStr(36,'data'); view.setUint32(40, interleaved.length*2, true);
    let idx = 44;
    for(let i=0;i<interleaved.length;i++){
      const s = Math.max(-1, Math.min(1, interleaved[i]));
      view.setInt16(idx, s < 0 ? s*0x8000 : s*0x7FFF, true); idx += 2;
    }
    return new Blob([view], { type:'audio/wav' });
  }
  document.getElementById('rec').addEventListener('click', function(){
    if(!ctx) return;
    isRec = !isRec;
    if(isRec){
      recBuffersL = []; recBuffersR = [];
      this.innerText = 'STOP & SAVE'; this.classList.add('on');
    } else {
      this.innerText = 'REC WAV'; this.classList.remove('on');
      const blob = encodeWav(recBuffersL, recBuffersR, ctx.sampleRate);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `omchs-${Date.now()}.wav`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      recBuffersL = []; recBuffersR = [];
    }
  });

  // ---------- Patch bay ----------
  function getSourceNode(id){
    if(id === 'lfo') return lfoSrc;
    if(id === 'random') return randSrc;
    if(id === 'follow') return envSrc;
    if(id === 'loopenv') return envLoopSrc;
    if(id === 'rungler') return runglerNode;
    if(id === 'oscA') return oscASum;
    if(id === 'oscB') return oscBSum;
    if(id.startsWith('plate')) return plateSrcs[parseInt(id.slice(5), 10)];
  }
  // Reverse map: destId -> the knob whose ring should show modulation range for it
  const destOwner = {};
  Object.keys(knobIO).forEach(kId => { (knobIO[kId].in || []).forEach(destId => { destOwner[destId] = kId; }); });
  function updateModRing(knobId){
    const c = configById[knobId];
    const io = knobIO[knobId];
    if(!c || !io || !io.in) return;
    const el = document.getElementById('d-'+knobId);
    if(!el) return;
    const modring = el.closest('.dialbox').querySelector('.modring');
    if(!modring) return;
    let modUnits = 0;
    if(audioReady){
      io.in.forEach(destId => {
        const dest = destDefs.find(d => d.id === destId);
        if(!dest || !dest.targets[0]) return;
        const sens = dest.targets[0].sens;
        patchCables.filter(cb => cb.dstId === destId).forEach(cb => { modUnits += Math.abs(cb.depth) * sens; });
      });
    }
    const range = c.max - c.min;
    const modPct = range > 0 ? Math.min(0.5, modUnits / range) : 0;
    const pct = pctOf(c, params[knobId]);
    const lo = Math.max(0, pct - modPct), hi = Math.min(1, pct + modPct);
    modring.style.setProperty('--modA', (lo*270)+'deg');
    modring.style.setProperty('--modB', (hi*270)+'deg');
    modring.style.opacity = modPct > 0.002 ? '1' : '0';
  }
  const cableColors = ['#dfb249', '#b98ff2', '#6fd8d0', '#ff9d5d', '#7ad1ff'];
  const cableLayer = document.getElementById('cableLayer');
  let dragTemp = null, dragOrigin = null;

  function faceRect(){ return document.querySelector('.faceplate').getBoundingClientRect(); }
  function jackCenter(el){
    const r = el.getBoundingClientRect(), p = faceRect();
    return { x: r.left + r.width/2 - p.left, y: r.top + r.height/2 - p.top };
  }
  function bezierMid(p1, p2){
    const dx = Math.max(40, Math.abs(p2.x-p1.x)*0.5);
    const c1 = { x:p1.x+dx, y:p1.y }, c2 = { x:p2.x-dx, y:p2.y };
    return { x: 0.125*p1.x+0.375*c1.x+0.375*c2.x+0.125*p2.x, y: 0.125*p1.y+0.375*c1.y+0.375*c2.y+0.125*p2.y };
  }
  function bezier(p1, p2){
    const dx = Math.max(40, Math.abs(p2.x-p1.x)*0.5);
    return `M ${p1.x} ${p1.y} C ${p1.x+dx} ${p1.y}, ${p2.x-dx} ${p2.y}, ${p2.x} ${p2.y}`;
  }
  function wireJacks(){
    document.querySelectorAll('.jack').forEach(j => {
      j.addEventListener('pointerdown', e => {
        if(!ctx) return;
        e.stopPropagation();
        j.setPointerCapture(e.pointerId);
        dragOrigin = j;
        dragTemp = document.createElementNS(svgNS, 'path');
        dragTemp.setAttribute('stroke', '#fff6'); dragTemp.setAttribute('fill', 'none'); dragTemp.setAttribute('stroke-width', 2);
        dragTemp.setAttribute('stroke-dasharray', '4 3');
        cableLayer.appendChild(dragTemp);
      });
      j.addEventListener('pointerup', e => {
        if(!dragTemp) return;
        const target = document.elementFromPoint(e.clientX, e.clientY);
        dragTemp.remove(); dragTemp = null;
        if(target && target.classList.contains('jack') && target.dataset.kind !== dragOrigin.dataset.kind){
          const srcId = dragOrigin.dataset.kind === 'src' ? dragOrigin.dataset.id : target.dataset.id;
          const dstId = dragOrigin.dataset.kind === 'dst' ? dragOrigin.dataset.id : target.dataset.id;
          addPatch(srcId, dstId);
        }
        dragOrigin = null;
      });
    });
  }
  document.addEventListener('pointermove', e => {
    if(!dragTemp || !dragOrigin) return;
    const p = faceRect();
    dragTemp.setAttribute('d', bezier(jackCenter(dragOrigin), { x: e.clientX - p.left, y: e.clientY - p.top }));
  });

  function applyDepth(cable){
    cable.depthGain.gain.setTargetAtTime(cable.depth, ctx.currentTime, 0.01);
    cable.pathEl.setAttribute('stroke-width', 2 + Math.abs(cable.depth)*5);
    cable.pathEl.setAttribute('opacity', 0.4 + Math.abs(cable.depth)*0.6);
    cable.handleEl.setAttribute('r', 5 + Math.abs(cable.depth)*4);
    cable.handleEl.setAttribute('fill-opacity', 0.5 + Math.abs(cable.depth)*0.5);
    cable.handleEl.setAttribute('stroke', cable.depth < 0 ? '#ff5d5d' : '#ffffff');
    updateModRing(destOwner[cable.dstId]);
  }
  function addPatch(srcId, dstId){
    if(!ctx) return;
    if(patchCables.some(c => c.srcId === srcId && c.dstId === dstId)) return;
    const srcNode = getSourceNode(srcId);
    const dest = destDefs.find(d => d.id === dstId);
    if(!srcNode || !dest) return;
    const depthGain = ctx.createGain(); depthGain.gain.value = 0.5;
    srcNode.connect(depthGain);
    const sensGains = dest.targets.map(t => {
      const g = ctx.createGain(); g.gain.value = t.sens;
      depthGain.connect(g); g.connect(t.getParam());
      return g;
    });
    const color = cableColors[patchCables.length % cableColors.length];
    const pathEl = document.createElementNS(svgNS, 'path');
    pathEl.setAttribute('stroke', color); pathEl.setAttribute('fill', 'none'); pathEl.setAttribute('stroke-width', 4);
    pathEl.style.cursor = 'pointer';
    cableLayer.appendChild(pathEl);
    // Attenuverter handle: a draggable dot at the cable's midpoint. Drag it to
    // set depth/polarity (up = positive, down = negative). A plain click (no
    // drag) removes the cable — the easiest way to delete a patch.
    const handleEl = document.createElementNS(svgNS, 'circle');
    handleEl.setAttribute('r', 7); handleEl.setAttribute('fill', color); handleEl.setAttribute('stroke', '#fff');
    handleEl.setAttribute('stroke-width', 1.5); handleEl.style.cursor = 'ns-resize';
    cableLayer.appendChild(handleEl);
    const cable = { srcId, dstId, depthGain, sensGains, pathEl, handleEl, depth: 0.5 };
    pathEl.addEventListener('click', () => removePatch(cable));
    let downY = 0, moved = false, startDepth = 0;
    handleEl.addEventListener('pointerdown', e => {
      e.stopPropagation(); handleEl.setPointerCapture(e.pointerId);
      downY = e.clientY; moved = false; startDepth = cable.depth;
    });
    handleEl.addEventListener('pointermove', e => {
      if(e.buttons === 0) return;
      const dy = downY - e.clientY;
      if(Math.abs(dy) > 3) moved = true;
      if(moved){ cable.depth = Math.max(-1, Math.min(1, startDepth + dy/80)); applyDepth(cable); }
    });
    handleEl.addEventListener('pointerup', () => { if(!moved) removePatch(cable); });
    handleEl.addEventListener('dblclick', e => { e.stopPropagation(); cable.depth = 0.5; applyDepth(cable); });
    patchCables.push(cable);
    applyDepth(cable);
    updateCables();
  }
  function removePatch(cable){
    const srcNode = getSourceNode(cable.srcId);
    try{ srcNode.disconnect(cable.depthGain); }catch(e){}
    cable.depthGain.disconnect();
    cable.sensGains.forEach(g => g.disconnect());
    cable.pathEl.remove();
    cable.handleEl.remove();
    patchCables = patchCables.filter(c => c !== cable);
    updateModRing(destOwner[cable.dstId]);
  }
  function updateCables(){
    patchCables.forEach(c => {
      const s = document.getElementById('jack-src-'+c.srcId), d = document.getElementById('jack-dst-'+c.dstId);
      if(!s || !d) return;
      const p1 = jackCenter(s), p2 = jackCenter(d);
      c.pathEl.setAttribute('d', bezier(p1, p2));
      const mid = bezierMid(p1, p2);
      c.handleEl.setAttribute('cx', mid.x); c.handleEl.setAttribute('cy', mid.y);
    });
  }
  document.getElementById('clearpatch').addEventListener('click', () => { [...patchCables].forEach(removePatch); });
  window.addEventListener('resize', updateCables);

  // ---------- Scope + VU + envelope follower ----------
  function drawScope(){
    const canvas = document.getElementById('scope'), sCtx = canvas.getContext('2d');
    const len = analyserL.frequencyBinCount;
    const dataL = new Uint8Array(len), dataR = new Uint8Array(len);
    const vuL = document.getElementById('vuL'), vuR = document.getElementById('vuR');
    let frame = 0;
    function draw(){
      requestAnimationFrame(draw);
      if(!analyserL) return;
      analyserL.getByteTimeDomainData(dataL); analyserR.getByteTimeDomainData(dataR);
      sCtx.fillStyle = '#150f1a'; sCtx.fillRect(0,0,canvas.width,canvas.height);
      const sw = canvas.width/len;
      let peakL = 0, peakR = 0;
      [{data:dataL, color:'#dfb249'}, {data:dataR, color:'#6fd8d0'}].forEach(ch => {
        sCtx.lineWidth = 1.6; sCtx.strokeStyle = ch.color; sCtx.beginPath();
        let x = 0;
        for(let i=0;i<len;i++){
          const y = (ch.data[i]/128.0) * canvas.height/2;
          if(i===0) sCtx.moveTo(x,y); else sCtx.lineTo(x,y);
          x += sw;
        }
        sCtx.stroke();
      });
      for(let i=0;i<len;i++){ peakL = Math.max(peakL, Math.abs(dataL[i]-128)); peakR = Math.max(peakR, Math.abs(dataR[i]-128)); }
      frame++;
      if(frame % 2 === 0){
        vuL.style.height = Math.min(100, (peakL/128)*130) + '%';
        vuR.style.height = Math.min(100, (peakR/128)*130) + '%';
        if(ctx && !isMute) envSrc.offset.setTargetAtTime(Math.max(peakL,peakR)/128, ctx.currentTime, 0.06);
      }
    }
    draw();
  }
})();
</script>
</body>
